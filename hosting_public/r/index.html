    // =========================================================================
    //  Place Order (Zero Firebase - Sent to Google Sheet)
    // =========================================================================
    async function handlePlaceOrder() {
      if (state.placing) return;

      // Operational License & Feature Guard
      if (state.store) {
        if (state.store.status === 'EXPIRED' || state.store.is_expired === true || state.store.plan_status === 'EXPIRED') {
          showToast('Dining orders are temporarily suspended for this restaurant. Please contact restaurant staff.', 'error');
          return;
        }
        if (state.store.features && state.store.features.qrOrdering === false) {
          showToast('Online QR ordering is not enabled for this restaurant. Please order directly with staff.', 'error');
          return;
        }
      }

      saveFormFields();

      // Enforce MANDATORY customer name
      if (!state.customerName || state.customerName.trim().length < 2) {
        showToast('Please enter your Name before placing the order!', 'error');
        state.checkoutOpen = true;
        renderMenu();
        setTimeout(() => {
          const nameInput = document.getElementById('customerNameInput');
          if (nameInput) {
            nameInput.focus();
            nameInput.classList.add('ring-2', 'ring-red-500', 'animate-shake');
            setTimeout(() => nameInput.classList.remove('animate-shake'), 400);
          }
        }, 100);
        return;
      }

      // Enforce phone validation if provided
      if (state.customerPhone && state.customerPhone.trim().length > 0) {
        const cleanPhone = state.customerPhone.trim().replace(/\D/g, '');
        if (!/^[6-9]\d{9}$/.test(cleanPhone)) {
          showToast('Please enter a valid 10-digit mobile number!', 'error');
          state.checkoutOpen = true;
          renderMenu();
          setTimeout(() => {
            const phoneInput = document.getElementById('customerPhoneInput');
            if (phoneInput) {
              phoneInput.focus();
              phoneInput.classList.add('ring-2', 'ring-red-500', 'animate-shake');
              setTimeout(() => phoneInput.classList.remove('animate-shake'), 400);
            }
          }, 100);
          return;
        }
        state.customerPhone = cleanPhone;
      }

      // Enforce valid dining table number
      if (!state.tableNumber || String(state.tableNumber).trim().length === 0) {
        showToast('Please select or enter your Table Number before placing the order!', 'error');
        openTableSelectModal();
        return;
      }

      const cartItems = getCartItems();
      if (cartItems.length === 0) {
        showToast('Your cart is empty');
        return;
      }

      const unavailable = cartItems.filter(ci => ci.item.available === false || ci.item.is_available === false);
      if (unavailable.length > 0) {
        showToast(`"${unavailable[0].item.name}" is sold out. Please remove it to proceed.`, 'error');
        state.checkoutOpen = true;
        renderMenu();
        return;
      }

      const subtotal = getCartSubtotal();
      const serviceChargeAmt = getCartServiceCharge();
      const gstAmt = getCartGst();
      const grandTotal = getCartGrandTotal();
      state.placing = true;
      renderMenu();

      try {
        const guestName = sanitizeFormulaPrefix(state.customerName.trim());
        const guestPhone = sanitizeFormulaPrefix(state.customerPhone.trim());
        const specialInstr = sanitizeFormulaPrefix((state.specialInstructions || '').trim());
        let kotNumber = getNextDailyToken();
        let orderId = kotNumber;

        // Deduplicate cart items by product ID & price
        const mergedCartMap = {};
        cartItems.forEach(ci => {
          const key = (ci.item.id || ci.item.name) + '_' + ci.item.price;
          if (mergedCartMap[key]) {
            mergedCartMap[key].qty += ci.qty;
          } else {
            mergedCartMap[key] = {
              productId: ci.item.id || 'item',
              name: ci.item.name,
              price: ci.item.price,
              qty: ci.qty,
              unit: ci.item.unit || 'plate',
              isVeg: ci.item.isVeg !== undefined ? ci.item.isVeg : true,
              orderedBy: guestName,
              deviceId: state.deviceId
            };
          }
        });
        const cartItemsList = Object.values(mergedCartMap);

        // Dispatch order to Store Cloud Database via Apps Script Webhook
        if (state.googleSheetId || state.organizationId) {
          try {
            const webhookResult = await sendToGoogleSheetWebhook('SAVE_BILL', {
              id: kotNumber,
              bill_id: kotNumber,
              kotNumber: kotNumber,
              table: state.tableNumber,
              table_number: state.tableNumber,
              tableName: 'Table ' + state.tableNumber,
              table_name: 'Table ' + state.tableNumber,
              customer_name: guestName || ('Table ' + state.tableNumber),
              customer_phone: guestPhone || '',
              special_instructions: specialInstr,
              items: cartItemsList,
              subtotal_amount: subtotal,
              subtotal: subtotal,
              service_charge: serviceChargeAmt,
              service_charge_rate: Number(state.serviceCharge) || 0,
              gst: gstAmt,
              gst_rate: Number(state.gstRate) || 5,
              total_amount: grandTotal,
              total: grandTotal,
              order_source: 'QR_MENU',
              orderSource: 'QR_MENU',
              orderType: 'Dine-In',
              payment_mode: 'DINE_IN (Table ' + state.tableNumber + ')',
              payment_status: 'PENDING',
              kitchenStatus: 'PENDING',
              status: 'PENDING',
              timestamp: new Date().toISOString()
            });
            if (!webhookResult || webhookResult.success === false || webhookResult.ok === false) {
              const errMsg = (webhookResult && (webhookResult.error || webhookResult.message)) || 'Order submission failed on server';
              throw new Error(errMsg);
            }
            if (webhookResult && (webhookResult.id || webhookResult.order_id || webhookResult.kotNumber)) {
              orderId = webhookResult.id || webhookResult.order_id || kotNumber;
              kotNumber = webhookResult.kotNumber || webhookResult.kot_number || kotNumber;
              state.lastKotNumber = kotNumber;
            }
          } catch (err) {
            console.error('Order dispatch error:', err);
            showToast(err.message || 'Order failed to reach kitchen. Please try again.', 'error');
            state.placing = false;
            renderMenu();
            return; // Don't clear cart
          }
        }

        const summaryItems = cartItems.map(ci => ({
          name: ci.item.name,
          qty: ci.qty,
          price: ci.item.price,
          orderedBy: guestName,
          deviceId: state.deviceId
        }));

        state.orderPlaced = {
          orderId: orderId,
          kotNumber: kotNumber,
          items: summaryItems,
          subtotal: subtotal,
          serviceCharge: serviceChargeAmt,
          gst: gstAmt,
          total: grandTotal,
          customerName: guestName,
          customerPhone: guestPhone,
          deviceId: state.deviceId,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          timestampMs: Date.now(),
          status: 'ORDER_RECEIVED'
        };

        state.orderHistory = state.orderHistory || [];
        state.orderHistory.push(state.orderPlaced);
        saveLocalOrderHistory();
        state.orderStatus = 'pending';
        state.placing = false;
        state.cart = {};
        state.checkoutOpen = false;

        renderOrderSuccess();

        // Start polling orders from Google Sheet for live table sync!
        startPollingOrdersFromSheet();

      } catch (err) {
        state.placing = false;
        console.error('Order failed:', err);
        showToast('Failed to place order. Please try again.', 'error');
        renderMenu();
      }
    }

    // =========================================================================
    //  Cloud Backend Orders Polling (Multi-User Table Real-time Sync)
    //  Directly queries Apps Script Webhook - 100% Zero Google Login & Private Sheets
    // =========================================================================
    async function syncOrdersFromGoogleSheet() {
      if (!state.organizationId && !state.googleSheetId) return;

      try {
        let proxyUrl = `${DEFAULT_APPS_SCRIPT_WEBHOOK}?action=GET_ORDERS&table=${encodeURIComponent(state.tableNumber)}`;
        if (state.organizationId) {
          proxyUrl += `&org=${encodeURIComponent(state.organizationId)}`;
        }
        if (state.googleSheetId && !state.googleSheetId.startsWith('sheet_')) {
          proxyUrl += `&sheet=${encodeURIComponent(state.googleSheetId)}`;
        }

        const resp = await fetch(proxyUrl, { cache: 'no-store' });
        if (resp.ok) {
          const json = await resp.json();
          if (json && json.success && Array.isArray(json.orders)) {
            const orderMap = new Map();
            let tablePaidTxn = '';

            for (const o of json.orders) {
              const rawId = o.id || o.orderId || '';
              if (!rawId || String(rawId).toLowerCase().includes('id')) continue;
              const canonicalId = String(rawId).replace(/^BILL_/, '');
              const rawTotal = Number(o.total || o.totalAmount || 0);
              let rawStatus = String(o.status || 'PENDING').trim();
              if (rawStatus.startsWith('[') || rawStatus.startsWith('{') || rawStatus.includes('"productId"') || rawStatus.includes('"name"')) {
                rawStatus = 'PENDING';
              }
              const rawTxn = String(o.transactionId || '');
              if (rawTxn && (rawStatus.toUpperCase() === 'PAID' || rawStatus.toUpperCase() === 'SUCCESS')) {
                tablePaidTxn = rawTxn;
              }

              let items = [];
              if (Array.isArray(o.items) && o.items.length > 0) {
                items = o.items;
              } else if (o.itemsSummary) {
                try {
                  const p = JSON.parse(o.itemsSummary);
                  if (Array.isArray(p)) items = p;
                } catch (_) {
                  items = [{ name: String(o.itemsSummary), qty: 1, price: rawTotal }];
                }
              } else {
                items = [{ name: 'Dine-In Order', qty: 1, price: rawTotal }];
              }

              const orderObj = {
                orderId: String(rawId),
                kotNumber: canonicalId.startsWith('KOT-') ? canonicalId : ('KOT-' + canonicalId),
                customerName: String(o.customerName || 'Guest'),
                customerPhone: String(o.customerPhone || ''),
                items: items,
                total: rawTotal,
                status: rawStatus,
                paymentMode: String(o.paymentMode || ''),
                transactionId: rawTxn,
                timestamp: String(o.timestamp || 'Earlier')
              };

              if (orderMap.has(canonicalId)) {
                const prev = orderMap.get(canonicalId);
                const prevRank = getStageIndex(prev.status);
                const incomingRank = getStageIndex(rawStatus);
                if (incomingRank >= prevRank) {
                  orderMap.set(canonicalId, orderObj);
                } else {
                  orderObj.status = prev.status;
                  orderMap.set(canonicalId, orderObj);
                }
              } else {
                orderMap.set(canonicalId, orderObj);
              }
            }

            const remoteOrders = Array.from(orderMap.values());

            if (remoteOrders.length > 0) {
              // Table is ONLY paid if ALL orders on this table are settled/paid
              const hasUnpaidOrders = remoteOrders.some(o => {
                const st = String(o.status || '').toUpperCase();
                return st !== 'PAID' && st !== 'SUCCESS' && st !== 'COMPLETED' && st !== 'SETTLED' && st !== 'CANCELLED';
              });
              const tablePaid = !hasUnpaidOrders;

              // Specifically match current device's active placed order if available
              let activeOrder = null;
              if (state.orderPlaced && (state.orderPlaced.kotNumber || state.orderPlaced.orderId)) {
                const myKot = String(state.orderPlaced.kotNumber || state.orderPlaced.orderId).replace(/^BILL_/, '');
                activeOrder = remoteOrders.find(o => {
                  const oKot = String(o.kotNumber || o.orderId || '').replace(/^BILL_/, '');
                  return oKot === myKot;
                });
              }
              if (!activeOrder) {
                activeOrder = remoteOrders[remoteOrders.length - 1];
              }

              const sanitizedRemoteStatus = sanitizeStatus(activeOrder.status);
              const curRank = getStageIndex(state.orderStatus);
              const newRank = getStageIndex(sanitizedRemoteStatus);

              let computedStatus = state.orderStatus;
              if (tablePaid) {
                computedStatus = 'paid';
              } else {
                // If there are active unpaid orders, don't stay locked to 'paid'
                if (computedStatus === 'paid' && hasUnpaidOrders) {
                  computedStatus = sanitizedRemoteStatus;
                } else if (newRank >= curRank) {
                  computedStatus = sanitizedRemoteStatus;
                }
              }

              // Generate a signature of current order state to detect real changes
              const newSig = JSON.stringify(remoteOrders.map(o => [o.orderId, o.status, o.total, (o.items || []).length])) + '_' + computedStatus + '_' + (tablePaid ? '1' : '0');

              state.orderHistory = remoteOrders;
              saveLocalOrderHistory();
              state.orderPlaced = activeOrder;
              state.orderStatus = computedStatus;

              if (tablePaid) {
                state.paymentSubmitted = false;
                if (!state.paymentReceipt) {
                  state.paymentReceipt = buildFallbackReceipt(remoteOrders, getGrandTotal());
                  if (tablePaidTxn) state.paymentReceipt.transactionId = tablePaidTxn;
                  try {
                    const key = state.tableToken || state.googleSheetId;
                    localStorage.setItem('sb_receipt_' + key, JSON.stringify(state.paymentReceipt));
                  } catch (_) {}
                  autoDownloadReceipt(state.paymentReceipt);
                  showToast('Payment verified by cashier! Digital receipt ready ✅', 'success');
                }
              } else if (!tablePaid && state.paymentReceipt) {
                state.paymentReceipt = null;
              }

              // ONLY re-render if data has ACTUALLY changed! (Zero UI fluctuation / zero flashing)
              if (state._lastSyncedSignature !== newSig) {
                state._lastSyncedSignature = newSig;
                const container = document.getElementById('orderSuccessScreen') || document.getElementById('receiptScreen');
                if (container) {
                  renderOrderSuccess();
                } else if (state.currentView === 'menu') {
                  renderMenu();
                }
              }
              return;
            } else {
              // Table is clean / vacant (no remote orders for this table)
              // If this device had no active uncompleted order, reset table to fresh menu!
              if (!state.orderPlaced || (state.orderStatus === 'paid' || state.orderStatus === 'success')) {
                const key = state.tableToken || state.googleSheetId;
                try {
                  localStorage.removeItem('sb_orders_' + key);
                  localStorage.removeItem('sb_receipt_' + key);
                } catch (_) {}
                state.orderHistory = [];
                state.orderPlaced = null;
                state.orderStatus = null;
                state.paymentReceipt = null;
                if (state.currentView === 'status') {
                  state.currentView = 'menu';
                  renderMenu();
                }
              }
            }
          }
        }
      } catch (e) {
        console.warn('[Orders] Sync error:', e);
      }
    }

    function startListeningToOrderStatus(orderId) {
      syncOrdersFromGoogleSheet();
    }

    function startPollingOrdersFromSheet() {
      if (state.orderPollingTimer) clearInterval(state.orderPollingTimer);
      state.orderPollingTimer = setInterval(syncOrdersFromGoogleSheet, 2500);
    }

    // =========================================================================
    //  Menu Loader (Pure Store Catalog via Cloud Backend Webhook)
    //  Zero Google Login, Zero GViz Redirects, 100% Private Google Sheets
    // =========================================================================
    async function loadMenu() {
      const orgId = state.organizationId;
      const sheetId = state.googleSheetId;

      // 1. PRIMARY: Google Apps Script Webhook
      if (state.organizationId || state.googleSheetId) {
        try {
          let proxyUrl = `${DEFAULT_APPS_SCRIPT_WEBHOOK}?action=GET_MENU`;
          if (state.organizationId) {
            proxyUrl += `&org=${encodeURIComponent(state.organizationId)}`;
          }
          if (state.googleSheetId && !state.googleSheetId.startsWith('sheet_')) {
            proxyUrl += `&sheet=${encodeURIComponent(state.googleSheetId)}`;
          }

          const proxyResp = await fetch(proxyUrl, { cache: 'no-store' });
          if (proxyResp.ok) {
            const proxyJson = await proxyResp.json();
            if (proxyJson && proxyJson.success && Array.isArray(proxyJson.items) && proxyJson.items.length > 0) {
              console.log(`[Menu] Loaded ${proxyJson.items.length} items from connected Google Sheet via Apps Script.`);
              return proxyJson.items;
            }
          }
        } catch (e) {
          console.warn('[Menu] Apps Script proxy fetch error:', e);
        }
      }

      // 2. Fallback: Direct Firestore Sanitized Public Store check (Safe & Direct)
      if (orgId) {
        try {
          const storeUrl = `https://firestore.googleapis.com/v1/projects/smartdine-restaurant-pos/databases/(default)/documents/public_stores/${encodeURIComponent(orgId)}`;
          const storeResp = await fetch(storeUrl, { cache: 'no-store' });
          if (storeResp.ok) {
            const storeDoc = await storeResp.json();
            const f = storeDoc.fields || {};

            if (f.name?.stringValue && (!state.restaurant.name || state.restaurant.name === 'Restaurant')) {
              state.restaurant.name = f.name.stringValue;
            }
            if (f.upiId?.stringValue && !state.upiId) {
              state.upiId = f.upiId.stringValue;
            }

            // Check if menu_items array exists directly on the public_stores document
            if (f.menu_items && f.menu_items.arrayValue && Array.isArray(f.menu_items.arrayValue.values)) {
              const dishes = f.menu_items.arrayValue.values.map(v => {
                const mf = v.mapValue?.fields || {};
                const name = mf.name?.stringValue || '';
                const price = Number(mf.price?.doubleValue ?? mf.price?.integerValue ?? 0);
                const category = mf.category?.stringValue || 'Main Course';
                const subcategory = mf.subcategory?.stringValue || 'General';
                const description = mf.description?.stringValue || '';
                const isVeg = mf.isVeg !== undefined ? (mf.isVeg.booleanValue !== false) : true;
                const isAvailable = (mf.isAvailable !== undefined ? mf.isAvailable.booleanValue !== false : true) &&
                                    (mf.is_available !== undefined ? mf.is_available.booleanValue !== false : true);
                const isTimeRestricted = mf.isTimeRestricted?.booleanValue || mf.is_time_restricted?.booleanValue || false;
                const availableFrom = mf.availableFrom?.stringValue || mf.available_from?.stringValue || '';
                const availableTo = mf.availableTo?.stringValue || mf.available_to?.stringValue || '';
                const id = mf.id?.stringValue || ('dish_' + Math.random().toString(36).substr(2, 9));
                return {
                  id,
                  name,
                  price,
                  category,
                  subcategory,
                  description,
                  isVeg,
                  available: isAvailable,
                  isAvailable: isAvailable,
                  isTimeRestricted: isTimeRestricted,
                  availableFrom: availableFrom,
                  availableTo: availableTo
                };
              }).filter(it => it.name && it.name.trim().length > 0);

              if (dishes.length > 0) {
                console.log(`[Menu] Loaded ${dishes.length} dishes dynamically from public store profile.`);
                return dishes;
              }
            }
          }
        } catch (storeErr) {
          console.warn('[Menu] Store document menu check warning:', storeErr);
        }
      }

      // 3. Real-Time Fallback: Direct Firestore REST query for store products
      if (orgId) {
        try {
          console.log(`[Menu] Fetching live menu from Firestore products for org: ${orgId}`);
          const fsQueryUrl = `https://firestore.googleapis.com/v1/projects/smartdine-restaurant-pos/databases/(default)/documents:runQuery`;
          const queryBody = {
            structuredQuery: {
              from: [{ collectionId: 'products' }],
              where: {
                fieldFilter: {
                  field: { fieldPath: 'organizationId' },
                  op: 'EQUAL',
                  value: { stringValue: orgId }
                }
              }
            }
          };

          const fsResp = await fetch(fsQueryUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(queryBody)
          });

          if (fsResp.ok) {
            const fsJson = await fsResp.json();
            const fallbackItems = [];
            if (Array.isArray(fsJson)) {
              for (const entry of fsJson) {
                if (!entry.document || !entry.document.fields) continue;
                const f = entry.document.fields;
                const isActive = f.is_active ? f.is_active.booleanValue !== false : true;
                const name = f.name?.stringValue || '';
                if (!isActive || !name || name === 'DELETED') continue;

                const price = Number(f.price?.doubleValue ?? f.price?.integerValue ?? f.selling_price?.doubleValue ?? 0);
                const category = f.category?.stringValue || 'Main Course';
                const subcategory = f.subcategory?.stringValue || 'General';
                const description = f.description?.stringValue || '';
                const isVeg = f.isVeg !== undefined ? (f.isVeg.booleanValue !== false) : true;
                const isAvailable = (f.is_available !== undefined ? f.is_available.booleanValue !== false : true) &&
                                    (f.isAvailable !== undefined ? f.isAvailable.booleanValue !== false : true);
                const id = f.id?.stringValue || entry.document.name.split('/').pop();

                const isTimeRestricted = f.is_time_restricted?.booleanValue || f.isTimeRestricted?.booleanValue || false;
                const availableFrom = f.available_from?.stringValue || f.availableFrom?.stringValue || '';
                const availableTo = f.available_to?.stringValue || f.availableTo?.stringValue || '';

                fallbackItems.push({
                  id,
                  name,
                  price,
                  category,
                  subcategory,
                  description,
                  isVeg,
                  available: isAvailable,
                  isAvailable: isAvailable,
                  isTimeRestricted: isTimeRestricted,
                  availableFrom: availableFrom,
                  availableTo: availableTo
                });
              }

              if (fallbackItems.length > 0) {
                console.log(`[Menu] Loaded ${fallbackItems.length} items from live store catalog.`);
                return fallbackItems;
              }
            }
          }
        } catch (fsErr) {
          console.warn('[Menu] Live catalog query error:', fsErr);
        }
      }

      // 4. Fallback: Direct Google Sheets Viz API Query (if Google Sheet ID is connected)
      if (state.googleSheetId && !state.googleSheetId.startsWith('sheet_')) {
        try {
          const sheetNames = ['Menu%20%26%20Modifiers', 'Menu', 'Sheet1'];
          for (const sName of sheetNames) {
            const gvizUrl = `https://docs.google.com/spreadsheets/d/${state.googleSheetId}/gviz/tq?tqx=out:json&sheet=${sName}`;
            const gvizResp = await fetch(gvizUrl, { cache: 'no-store' });
            if (gvizResp.ok) {
              const rawText = await gvizResp.text();
              const jsonMatch = rawText.match(/google\.visualization\.Query\.setResponse\((.*)\);/);
              if (jsonMatch && jsonMatch[1]) {
                const gData = JSON.parse(jsonMatch[1]);
                const rows = gData.table?.rows || [];
                if (rows.length > 0) {
                  const gItems = [];
                  for (let i = 0; i < rows.length; i++) {
                    const c = rows[i].c || [];
                    const id = c[0]?.v ? String(c[0].v) : ('dish_' + i);
                    const name = c[1]?.v ? String(c[1].v) : '';
                    if (!name || name.trim().length === 0) continue;
                    const cat = c[2]?.v ? String(c[2].v) : 'Main Course';
                    const price = Number(c[3]?.v || 0);
                    const foodType = c[4]?.v ? String(c[4].v).toLowerCase() : 'veg';
                    const isVeg = !foodType.includes('non');
                    const status = c[6]?.v ? String(c[6].v).toLowerCase() : 'available';
                    const isAvailable = !status.includes('out') && !status.includes('sold') && !status.includes('inactive');

                    gItems.push({
                      id,
                      name,
                      price,
                      category: cat,
                      subcategory: 'General',
                      description: '',
                      isVeg,
                      available: isAvailable,
                      isAvailable: isAvailable,
                      isTimeRestricted: false,
                      availableFrom: '',
                      availableTo: ''
                    });
                  }
                  if (gItems.length > 0) {
                    console.log(`[Menu] Loaded ${gItems.length} items from Google Sheets Viz API (${sName}).`);
                    return gItems;
                  }
                }
              }
            }
          }
        } catch (gvizErr) {
          console.warn('[Menu] Google Sheets Viz API query notice:', gvizErr);
        }
      }

      console.log('[Menu] No items found in store catalog or connected sheet.');
      return [];
    }

    // =========================================================================
    //  Init
    // =========================================================================
    async function init() {
      parseUrl();

      // Multi-Tenant Isolation:
      // If neither organizationId nor googleSheetId nor restaurantSlug is provided, do NOT load any default store!
      if (!state.organizationId && !state.googleSheetId && !state.restaurantSlug) {
        state.loading = false;
        renderScanQrPrompt();
        return;
      }

      state.loading = true;
      renderLoading();

      // Discard invalid cross-organization sheet ID (e.g. sheet_ORG264306 when org is ORG262638)
      if (state.googleSheetId && state.googleSheetId.startsWith('sheet_ORG') && state.organizationId && !state.googleSheetId.includes(state.organizationId)) {
        console.warn(`[Sheet] Discarded mismatching sheet ID ${state.googleSheetId} for org ${state.organizationId}`);
        state.googleSheetId = null;
      }

      // Fetch Master Razorpay Key from Firestore system_config
      try {
        const rzpUrl = `https://firestore.googleapis.com/v1/projects/smartdine-restaurant-pos/databases/(default)/documents/system_config/razorpay`;
        const rzpResp = await fetch(rzpUrl);
        if (rzpResp.ok) {
          const rzpDoc = await rzpResp.json();
          const rKey = rzpDoc.fields?.keyId?.stringValue;
          if (rKey && rKey.trim().length > 0) {
            state.razorpayKeyId = rKey.trim();
            console.log('[Init] Auto-configured Master Razorpay Key ID:', state.razorpayKeyId);
          }
        }
      } catch (rzpErr) {
        console.warn('[Init] Razorpay key lookup notice:', rzpErr);
      }

      // 1. Primary: Load Store Profile via Apps Script Webhook
      let storeLoadedFromWebhook = false;
      if (state.organizationId || state.googleSheetId) {
        try {
          let proxyUrl = `${DEFAULT_APPS_SCRIPT_WEBHOOK}?action=GET_STORE_PROFILE`;
          if (state.organizationId) proxyUrl += `&org=${encodeURIComponent(state.organizationId)}`;
          if (state.googleSheetId && !state.googleSheetId.startsWith('sheet_')) {
            proxyUrl += `&sheet=${encodeURIComponent(state.googleSheetId)}`;
          }
          const whResp = await fetch(proxyUrl);
          if (whResp.ok) {
            const whJson = await whResp.json();
            if (whJson.success && whJson.store) {
              storeLoadedFromWebhook = true;
              const s = whJson.store;
              if (s.name) state.restaurant.name = s.name;
              if (s.upi_id) {
                state.upiId = s.upi_id;
                state.settlementUpiId = s.upi_id;
              }
              if (s.currency) state.currency = s.currency;
              if (s.google_sheet_id && !state.googleSheetId) state.googleSheetId = s.google_sheet_id;
              if (s.gst_rate !== undefined) state.gstRate = Number(s.gst_rate);
              if (s.service_charge !== undefined) state.serviceCharge = Number(s.service_charge);
            } else if (whJson.upi_id) {
              state.upiId = whJson.upi_id;
              state.settlementUpiId = whJson.upi_id;
              storeLoadedFromWebhook = true;
            }
          }
        } catch (e) {
          console.warn('[Init] Webhook store profile notice:', e);
        }
      }

      // 2. Fallback: If org ID exists, resolve store details safely from Firestore public_stores
      if (state.organizationId && !storeLoadedFromWebhook) {
        try {
          const publicStoreUrl = `https://firestore.googleapis.com/v1/projects/smartdine-restaurant-pos/databases/(default)/documents/public_stores/${encodeURIComponent(state.organizationId)}`;
          const storeResp = await fetch(publicStoreUrl);
          if (storeResp.ok) {
            const storeDoc = await storeResp.json();
            const f = storeDoc.fields || {};
            if (f.name?.stringValue && (!state.restaurant.name || state.restaurant.name === 'Restaurant')) {
              state.restaurant.name = f.name.stringValue;
            }
            if (f.upiId?.stringValue) {
              state.upiId = f.upiId.stringValue;
              state.settlementUpiId = f.upiId.stringValue;
            }
            if (f.currency?.stringValue) {
              state.currency = f.currency.stringValue;
            }
            if (f.googleSheetId?.stringValue && !state.googleSheetId) {
              state.googleSheetId = f.googleSheetId.stringValue;
              console.log('[Init] Auto-configured Google Sheet ID from store profile:', state.googleSheetId);
            }
            if (f.gstRate?.doubleValue !== undefined || f.gstRate?.integerValue !== undefined) {
              state.gstRate = Number(f.gstRate?.doubleValue ?? f.gstRate?.integerValue ?? 5);
            }
            if (f.serviceCharge?.doubleValue !== undefined || f.serviceCharge?.integerValue !== undefined) {
              state.serviceCharge = Number(f.serviceCharge?.doubleValue ?? f.serviceCharge?.integerValue ?? 0);
            }
            if (f.operatingHours?.mapValue?.fields) {
              const oh = f.operatingHours.mapValue.fields;
              state.operatingHours = {
                isOpen: oh.isOpen?.booleanValue !== false,
                openFrom: oh.openFrom?.stringValue || '',
                openTo: oh.openTo?.stringValue || ''
              };
              if (oh.isOpen?.booleanValue === false) {
                state.isKitchenClosed = true;
              }
            }
          }
        } catch (e) {
          console.warn('[Init] Public store profile resolution notice:', e);
        }
      }

      try {
        state.menuItems = await loadMenu();

        const cats = [...new Set(state.menuItems.map(i => i.category || 'All Items'))];
        state.categories = ['All', ...cats];
        state.activeCategory = 'All';
        state.loading = false;

        // Restore active table session orders (expire after 60 mins)
        state.orderHistory = loadLocalOrderHistory();
        if (state.orderHistory && state.orderHistory.length > 0) {
          const latest = state.orderHistory[state.orderHistory.length - 1];
          const orderAge = latest.timestampMs ? (Date.now() - Number(latest.timestampMs)) : 0;
          if (!orderAge || orderAge < 60 * 60 * 1000) {
            state.orderPlaced = latest;
            state.orderStatus = latest.status || 'pending';
          } else {
            state.orderHistory = [];
            const key = state.tableToken || state.googleSheetId;
            try { localStorage.removeItem('sb_orders_' + key); } catch (_) {}
          }
        }

        // Check if receipt is already saved locally (expire after 60 mins)
        try {
          const key = state.tableToken || state.googleSheetId;
          const savedReceipt = localStorage.getItem('sb_receipt_' + key);
          if (savedReceipt) {
            const parsed = JSON.parse(savedReceipt);
            const rTime = parsed.savedAt ? Number(parsed.savedAt) : 0;
            if (rTime && (Date.now() - rTime) < 60 * 60 * 1000) {
              state.paymentReceipt = parsed;
              state.orderStatus = 'paid';
            } else {
              localStorage.removeItem('sb_receipt_' + key);
            }
          }
        } catch (e) {}

        // Start real-time sync with Google Sheet
        if (state.googleSheetId || state.organizationId) {
          startPollingOrdersFromSheet();
        }

        renderMenu();

      } catch (err) {
        console.error('Menu load error:', err);
        state.menuItems = [];
        state.categories = ['All'];
        state.loading = false;
        renderError();
      }
    }
