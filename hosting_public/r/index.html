<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Scan, Browse & Order from your table — Powered by SmartBizz">
  <title>SmartBizz Menu</title>
  <link rel="manifest" href="/r/manifest.json">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#f59e0b', 600: '#d97706' },
          }
        }
      }
    }
  </script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { overscroll-behavior-y: contain; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Hide scrollbar on category tabs */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Modern Luxury Hospitality Shimmer */
    @keyframes shimmer {
      0% { background-position: -600px 0; }
      100% { background-position: 600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 35%, #cbd5e1 50%, #e2e8f0 65%, #f1f5f9 100%);
      background-size: 600px 100%;
      animation: shimmer 1.6s infinite ease-in-out;
      border-radius: 0.75rem;
    }

    /* Validation Shake Animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.35s ease-in-out; }

    /* Tactile Spring Bounce for Cart & Quantities */
    @keyframes spring-bounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.22); }
      70% { transform: scale(0.94); }
      100% { transform: scale(1); }
    }
    .bounce-active { animation: spring-bounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    /* Pulsing Action & Live Sync Ring */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 0.35; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }
    .pulse-ring { animation: pulse-ring 2.2s infinite ease-in-out; }

    /* Slide-up modal */
    .modal-overlay { transition: opacity 0.3s ease; }
    .modal-sheet { transition: transform 0.3s ease; }
    .modal-hidden { display: none !important; pointer-events: none !important; visibility: hidden !important; }
    .modal-hidden .modal-overlay { opacity: 0; pointer-events: none; }
    .modal-hidden .modal-sheet { transform: translateY(100%); }

    /* Enhanced Toast */
    .toast {
      animation: toast-in 0.3s cubic-bezier(0.16, 1, 0.3, 1), toast-out 0.3s ease 3.4s forwards;
    }
    @keyframes toast-in { from { transform: translateY(100%) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes toast-out { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }

    /* Fade in */
    .fade-in { animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Quantity button press */
    .qty-btn:active { transform: scale(0.9); }
    .qty-btn { transition: transform 0.1s ease; }
  </style>
</head>
<body class="bg-white text-slate-900 min-h-screen">

  <!-- App Root -->
  <div id="app" class="max-w-md mx-auto min-h-screen relative"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none"></div>

  <script>
    // =========================================================================
    //  Constants & Webhook Configuration
    // =========================================================================
    const DEFAULT_APPS_SCRIPT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbxIAGxL_Chf3xMKfpqMyJ8fHkYq990x-WHSH6coCWpxQaWCH7zRV599esQ604oEVtrF/exec';
    // Pure Cloud Store Architecture

    const UPI_APPS = [
      { id: 'PHONEPE', name: 'PhonePe', color: '#5f259f', bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-300', badge: '🟣' },
      { id: 'GPAY', name: 'Google Pay', color: '#4285f4', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', badge: '🔵' },
      { id: 'PAYTM', name: 'Paytm', color: '#00b9f1', bg: 'bg-sky-50', text: 'text-sky-700', border: 'border-sky-300', badge: '🔷' },
      { id: 'CRED', name: 'CRED UPI', color: '#1a1a1a', bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-300', badge: '⚫' },
      { id: 'BHIM', name: 'BHIM UPI', color: '#00843d', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', badge: '🟢' },
      { id: 'ANY', name: 'Any UPI', color: '#2563eb', bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-300', badge: '📱' }
    ];

    // =========================================================================
    //  Device Identification
    // =========================================================================
    function getOrCreateDeviceId() {
      try {
        let id = localStorage.getItem('sb_guest_device_id');
        if (!id) {
          id = 'dev_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now().toString(36);
          localStorage.setItem('sb_guest_device_id', id);
        }
        return id;
      } catch (e) {
        return 'dev_' + Math.random().toString(36).substring(2, 9);
      }
    }

    // =========================================================================
    //  State
    // =========================================================================
    const state = {
      restaurantSlug: null,
      tableToken: null,
      googleSheetId: null,
      isSheetRestricted: false,
      organizationId: null,
      currentView: 'menu',  // 'menu' | 'status'
      restaurant: null,    // { name, id }
      tableNumber: '1',
      restaurantAddress: '',
      menuItems: [],
      categories: [],
      activeCategory: 'All',
      searchQuery: '',
      vegOnly: false,
      cart: {},             // { itemId: qty }
      checkoutOpen: false,
      deviceId: getOrCreateDeviceId(),
      customerName: localStorage.getItem('sb_customer_name') || '',
      customerPhone: localStorage.getItem('sb_customer_phone') || '',
      specialInstructions: '',
      orderPlaced: null,    // { orderId, kotNumber, items, total }
      orderHistory: [],     // All KOT orders placed for this table session
      orderStatus: null,
      upiId: null,          // Store default UPI VPA (e.g. merchant@upi)
      selectedUpiApp: 'PHONEPE',
      showUpiQr: false,
      billRequested: false,
      loading: true,
      error: null,
      placing: false,
      submittingPayment: false,
      paymentSubmitted: false,
      paymentConfirmModalOpen: false,
      paymentReceipt: null,
      orderPollingTimer: null,
      razorpayKeyId: 'rzp_test_51placeholder',
      settlementUpiId: '',
      operatingHours: null,
      isKitchenClosed: false,
      activeSubcategory: 'All'
    };

    const app = document.getElementById('app');

    // =========================================================================
    //  URL Parsing (Direct Google Sheet ID & Parameters)
    // =========================================================================
    function extractGoogleSheetId(raw) {
      if (!raw) return '';
      const str = String(raw).trim();
      const match = str.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) return match[1];
      return str.split('/')[0].split('?')[0].split('#')[0].trim();
    }

    function parseUrl() {
      const params = new URLSearchParams(window.location.search);
      const rawSheet = params.get('sheet') || params.get('s') || params.get('sheetId') || params.get('sheet_id') || params.get('spreadsheet');
      const tableParam = params.get('table') || params.get('t') || params.get('tableno') || params.get('table_number');
      const nameParam = params.get('name') || params.get('n') || params.get('restaurant') || params.get('shop') || params.get('store');
      const orgParam = params.get('org') || params.get('o') || params.get('orgId') || params.get('organization_id') || params.get('store_id');

      if (rawSheet && rawSheet.trim().length > 0) {
        const clean = extractGoogleSheetId(rawSheet);
        // Only accept real Google Drive spreadsheet IDs (not dummy sheet_ORG strings)
        if (clean && !clean.startsWith('sheet_') && !clean.startsWith('mock_') && clean.length > 10) {
          state.googleSheetId = clean;
        } else {
          state.googleSheetId = null;
        }
      }
      if (orgParam && orgParam.trim().length > 0) {
        state.organizationId = orgParam.trim();
      } else {
        state.organizationId = null;
      }

      const rawTable = tableParam ? String(tableParam).replace(/Table /i, '').trim().replace(/[^a-zA-Z0-9_-]/g, '') : null;
      state.tableNumber = rawTable;

      const lockKey = state.organizationId ? ('sb_active_table_' + state.organizationId) : null;
      let activeLockedTable = null;
      if (lockKey) {
        try { activeLockedTable = localStorage.getItem(lockKey); } catch (e) {}
      }

      // Device-Level Session Locking: If diner is currently ordering on a specific table, keep session
      if (activeLockedTable && rawTable && activeLockedTable !== rawTable) {
        const localOrders = loadLocalOrderHistory();
        const hasUnfinishedOrders = localOrders.some(o => {
          const st = String(o.status || '').toUpperCase();
          return st !== 'PAID' && st !== 'SUCCESS' && st !== 'CANCELLED';
        });
        if (hasUnfinishedOrders) {
          console.warn(`[Security] Locked to active Table ${activeLockedTable}. Cannot switch to Table ${rawTable} mid-meal.`);
          state.tableNumber = activeLockedTable;
        } else {
          state.tableNumber = rawTable;
          if (lockKey) { try { localStorage.setItem(lockKey, rawTable); } catch (e) {} }
        }
      } else if (rawTable && lockKey) {
        try { localStorage.setItem(lockKey, rawTable); } catch (e) {}
      }

      state.tableSignature = params.get('sig') || params.get('signature') || '';
      state.isExplicitTableFromUrl = !!tableParam;
      // SECURITY: UPI ID is NEVER trusted from URL query parameters.
      // This prevents attackers from diverting customer payments by tampering with the URL.
      // The UPI ID is strictly loaded from the verified database store profile.
      state.upiId = '';

      const restName = nameParam ? decodeURIComponent(nameParam).trim() : '';
      state.restaurant = {
        name: restName,
        id: state.organizationId || ''
      };

      state.tableToken = (state.organizationId && state.tableNumber) ? `${state.organizationId}_T${state.tableNumber}` : null;

      // Check legacy path /r/{slug}/t/{token}
      const path = window.location.pathname;
      const match = path.match(/\/r\/([^/]+)\/t\/([^/?#]+)/);
      if (match) {
        state.restaurantSlug = decodeURIComponent(match[1]);
        state.tableToken = decodeURIComponent(match[2]);
      } else if (params.get('token')) {
        state.restaurantSlug = params.get('slug') || 'restaurant';
        state.tableToken = params.get('token');
      }

      return true;
    }

    // =========================================================================
    //  Toast (With Animated Icons & Progress)
    // =========================================================================
    function showToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const icons = {
        error: '<span class="text-base">⚠️</span>',
        success: '<span class="text-base">✅</span>',
        info: '<span class="text-base">ℹ️</span>'
      };
      const colors = {
        error: 'bg-gradient-to-r from-red-600 to-rose-700 text-white shadow-red-500/20 border-red-500/30',
        success: 'bg-gradient-to-r from-emerald-600 to-teal-700 text-white shadow-emerald-500/20 border-emerald-500/30',
        info: 'bg-gradient-to-r from-slate-900 to-slate-800 text-white shadow-slate-900/30 border-slate-700'
      };

      const el = document.createElement('div');
      el.className = `toast px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2.5 border ${colors[type] || colors.info} pointer-events-auto backdrop-blur-md max-w-xs`;
      el.innerHTML = `
        <div class="flex-shrink-0">${icons[type] || icons.info}</div>
        <div class="flex-1 text-left leading-snug">${esc(message)}</div>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        el.style.transition = 'all 0.3s ease';
        setTimeout(() => el.remove(), 300);
      }, 3500);
    }

    // =========================================================================
    //  Renderers
    // =========================================================================

    // ---------- Hospitality Shimmer Loading Skeleton ----------
    function renderLoading() {
      app.innerHTML = `
        <div class="p-4 fade-in max-w-md mx-auto">
          <!-- Top Brand Header Skeleton -->
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
            <div class="space-y-1.5">
              <div class="skeleton h-6 w-40"></div>
              <div class="skeleton h-3.5 w-28"></div>
            </div>
            <div class="skeleton h-8 w-24 rounded-full"></div>
          </div>

          <!-- Search Bar Skeleton -->
          <div class="flex items-center gap-2 mb-4">
            <div class="skeleton h-10 flex-1 rounded-xl"></div>
            <div class="skeleton h-10 w-16 rounded-xl"></div>
          </div>

          <!-- Category Chips Carousel Skeleton -->
          <div class="flex gap-2 mb-6 overflow-hidden">
            <div class="skeleton h-8 w-16 rounded-full flex-shrink-0"></div>
            <div class="skeleton h-8 w-24 rounded-full flex-shrink-0"></div>
            <div class="skeleton h-8 w-20 rounded-full flex-shrink-0"></div>
            <div class="skeleton h-8 w-28 rounded-full flex-shrink-0"></div>
          </div>

          <!-- Menu Dish Card Skeletons -->
          <div class="space-y-3">
            ${Array(4).fill(0).map(() => `
              <div class="bg-white border border-slate-100 rounded-2xl p-3.5 shadow-2xs">
                <div class="flex justify-between items-start gap-3">
                  <div class="flex-1 space-y-2">
                    <div class="flex items-center gap-1.5">
                      <div class="skeleton w-3.5 h-3.5 rounded-xs"></div>
                      <div class="skeleton h-4 w-36 rounded-md"></div>
                    </div>
                    <div class="skeleton h-3 w-48 rounded-md"></div>
                    <div class="skeleton h-4 w-16 rounded-md pt-1"></div>
                  </div>
                  <div class="flex flex-col items-end justify-between h-14">
                    <div class="skeleton h-8 w-20 rounded-xl"></div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    // ---------- Error Page ----------
    function renderError() {
      app.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center fade-in">
          <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mb-4">
            <i data-lucide="alert-circle" class="w-8 h-8 text-red-500"></i>
          </div>
          <h1 class="text-xl font-bold text-slate-900 mb-2">${esc(state.error?.title || 'Unable to Load Menu')}</h1>
          <p class="text-sm text-slate-500 max-w-xs mb-6 leading-relaxed">${esc(state.error?.message || 'Please verify the QR code or link and try again.')}</p>
          <button onclick="init()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 transition active:scale-95">
            Try Again
          </button>
        </div>`;
      try { lucide.createIcons(); } catch(e) { console.warn("Lucide:", e); }
    }

    // ---------- Prompt to Scan Table QR Page ----------
    function renderScanQrPrompt() {
      app.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-slate-50 fade-in">
          <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-500 to-amber-600 flex items-center justify-center mb-5 shadow-xl shadow-amber-500/20 text-white">
            <i data-lucide="qr-code" class="w-10 h-10"></i>
          </div>
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-semibold mb-3">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            SmartDine Contactless Dining
          </div>
          <h1 class="text-2xl font-black text-slate-900 mb-2 tracking-tight">Scan Table QR Code</h1>
          <p class="text-xs text-slate-600 max-w-xs mb-6 leading-relaxed">
            To view your restaurant's live digital menu, call staff, or place food orders, please scan the QR code placed on your dining table.
          </p>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs max-w-xs w-full text-left mb-6 space-y-3">
            <div class="flex items-start gap-3">
              <div class="w-6 h-6 rounded-lg bg-amber-50 text-amber-700 flex items-center justify-center flex-shrink-0 text-xs font-bold border border-amber-200">1</div>
              <div>
                <p class="text-xs font-bold text-slate-900">Every Table Has a Unique QR</p>
                <p class="text-[11px] text-slate-500 leading-normal">Scanning your table's QR automatically connects you to your table and sends orders directly to the kitchen display.</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <div class="w-6 h-6 rounded-lg bg-blue-50 text-blue-700 flex items-center justify-center flex-shrink-0 text-xs font-bold border border-blue-200">2</div>
              <div>
                <p class="text-xs font-bold text-slate-900">Live Kitchen Tracking</p>
                <p class="text-[11px] text-slate-500 leading-normal">Track your food preparation status in real time right on your phone.</p>
              </div>
            </div>
          </div>
          <p class="text-[11px] text-slate-400">Powered by SmartDine Restaurant POS</p>
        </div>`;
      try { lucide.createIcons(); } catch(e) { console.warn("Lucide:", e); }
    }

    // ---------- Table Selection Modal Handlers ----------
    function openTableSelectModal() {
      const modal = document.getElementById('tableSelectModal');
      if (modal) modal.classList.remove('modal-hidden');
      setTimeout(() => {
        const inp = document.getElementById('directTableNumberInput');
        if (inp) inp.focus();
      }, 100);
    }

    function closeTableSelectModal() {
      const modal = document.getElementById('tableSelectModal');
      if (modal) modal.classList.add('modal-hidden');
    }

    function saveTableNumberDirect() {
      const inp = document.getElementById('directTableNumberInput');
      if (!inp || !inp.value.trim()) {
        showToast('Please enter your table number', 'error');
        return;
      }
      const clean = inp.value.trim().replace(/Table /i, '').replace(/[^a-zA-Z0-9_-]/g, '');
      if (!clean) {
        showToast('Please enter a valid table number', 'error');
        return;
      }
      state.tableNumber = clean;
      state.tableToken = (state.organizationId && state.tableNumber) ? `${state.organizationId}_T${state.tableNumber}` : null;
      closeTableSelectModal();
      showToast('Table set to #' + state.tableNumber + ' 👍', 'success');
      renderMenu();
    }

    // ---------- Navigation Handlers ----------
    function showOrderStatusScreen() {
      state.currentView = 'status';
      renderOrderSuccess();
      syncOrdersFromGoogleSheet();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---------- Interactive Dialogs & Actions ----------
    function openNameModal() {
      const modal = document.getElementById('namePromptModal');
      if (modal) modal.classList.remove('modal-hidden');
      setTimeout(() => {
        const inp = document.getElementById('guestNameDirectInput');
        if (inp) inp.focus();
      }, 100);
    }

    function closeNameModal() {
      const modal = document.getElementById('namePromptModal');
      if (modal) modal.classList.add('modal-hidden');
    }

    function saveGuestNameDirect() {
      const inp = document.getElementById('guestNameDirectInput');
      const phoneInp = document.getElementById('guestPhoneDirectInput');
      if (!inp || inp.value.trim().length < 2) {
        showToast('Please enter your name', 'error');
        return;
      }
      state.customerName = inp.value.trim();
      if (phoneInp) state.customerPhone = phoneInp.value.trim();
      try {
        localStorage.setItem('sb_customer_name', state.customerName);
        if (state.customerPhone) localStorage.setItem('sb_customer_phone', state.customerPhone);
      } catch (e) {}
      closeNameModal();
      showToast('Welcome, ' + state.customerName + '! 👋', 'success');
      renderMenu();
    }

    function openWaiterModal() {
      const modal = document.getElementById('waiterModal');
      if (modal) modal.classList.remove('modal-hidden');
    }

    function closeWaiterModal() {
      const modal = document.getElementById('waiterModal');
      if (modal) modal.classList.add('modal-hidden');
    }

    function sendWaiterAlert(reason) {
      closeWaiterModal();
      state.activeWaiterCall = { reason: reason, time: Date.now() };
      showToast(`🛎️ Waiter notified: "${reason}" for Table ${state.tableNumber}. Staff is on the way!`, 'success');
      if (state.googleSheetId || state.organizationId) {
        sendToGoogleSheetWebhook('SERVICE_REQUEST', {
          table: 'Table ' + state.tableNumber,
          request_type: reason,
          guest_name: state.customerName || 'Guest',
          timestamp: new Date().toISOString()
        });
      }
      const cont = document.getElementById('orderSuccessScreen');
      if (cont) renderOrderSuccess();
    }

    function openInstantPay() {
      const grandTotal = getGrandTotal();
      if (grandTotal <= 0 && getTotalCartCount() === 0) {
        showToast('No active orders to pay yet. Add dishes to cart first!', 'info');
        return;
      }
      state.currentView = 'status';
      renderOrderSuccess();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---------- Main Menu View ----------
    function renderMenu() {
      state.currentView = 'menu';

      const filtered = getFilteredItems();
      const cartCount = getTotalCartCount();
      const cartTotal = getCartTotal();
      const grandTotal = getGrandTotal();
      const totalTableItems = getTotalItemsCountAcrossRounds();

      const latestKot = (state.orderPlaced && state.orderPlaced.kotNumber) 
        ? state.orderPlaced.kotNumber 
        : (state.orderHistory && state.orderHistory.length > 0 ? state.orderHistory[state.orderHistory.length - 1].kotNumber : 'KOT');

      app.innerHTML = `
        <!-- Sticky Header -->
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-slate-100 px-4 py-2.5">
          <!-- Restaurant & Table Identity -->
          <div class="flex items-center justify-between mb-2">
            <div>
              <div class="flex items-center gap-1.5">
                <h1 class="text-base font-extrabold text-slate-900 leading-tight">${esc(state.restaurant?.name || 'Restaurant')}</h1>
                <span onclick="openTableSelectModal()" class="inline-flex items-center gap-1 text-[11px] font-bold ${state.tableNumber ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-amber-800 bg-amber-50 border-amber-300 animate-pulse'} border px-2 py-0.5 rounded-full cursor-pointer">
                  🍽️ ${state.tableNumber ? ('Table ' + esc(String(state.tableNumber))) : 'Select Table ▾'}
                </span>
              </div>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 relative flex items-center justify-center">
                  <span class="absolute w-full h-full rounded-full bg-emerald-400 pulse-ring"></span>

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return null;
      const s = String(timeStr).trim().toLowerCase();
      const isPm = s.includes('pm');
      const isAm = s.includes('am');
      const clean = s.replace(/am|pm/g, '').trim();
      const parts = clean.split(':').map(p => parseInt(p.trim(), 10));
      if (parts.length < 1 || isNaN(parts[0])) return null;
      let hours = parts[0];
      let mins = parts.length > 1 && !isNaN(parts[1]) ? parts[1] : 0;
      if (isPm && hours < 12) hours += 12;
      if (isAm && hours === 12) hours = 0;
      return hours * 60 + mins;
    }

    function isItemTimeAvailable(item) {
      if (!item) return true;
      // Strict boolean check (avoid truthy strings like 'false')
      const isRestricted = item.isTimeRestricted === true || 
                           item.isTimeRestricted === 'true' || 
                           item.is_time_restricted === true || 
                           item.is_time_restricted === 'true';
      if (!isRestricted) return true;

      const fromStr = item.availableFrom || item.available_from;
      const toStr = item.availableTo || item.available_to;
      if (!fromStr || !toStr) return true;

      const fromMins = parseTimeToMinutes(fromStr);
      const toMins = parseTimeToMinutes(toStr);
      if (fromMins === null || toMins === null) return true; // Graceful fallback

      // Check day of week if specified
      if (Array.isArray(item.availableDays) && item.availableDays.length > 0) {
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const todayStr = days[new Date().getDay()];
        const matchesDay = item.availableDays.some(d => String(d).toLowerCase().startsWith(todayStr.toLowerCase()));
        if (!matchesDay) return false;
      }

      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      if (toMins >= fromMins) {
        return currentMinutes >= fromMins && currentMinutes <= toMins;
      } else {
        // Overnight window (e.g. 22:00 to 03:00)
        return currentMinutes >= fromMins || currentMinutes <= toMins;
      }
    }

    function isKitchenClosedNow() {
      if (state.isKitchenClosed) return true;
      if (state.operatingHours) {
        if (state.operatingHours.isOpen === false) return true;
        const fromStr = state.operatingHours.openFrom;
        const toStr = state.operatingHours.openTo;
        if (fromStr && toStr) {
          const fromMins = parseTimeToMinutes(fromStr);
          const toMins = parseTimeToMinutes(toStr);
          if (fromMins !== null && toMins !== null) {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            if (toMins >= fromMins) {
              if (currentMinutes < fromMins || currentMinutes > toMins) return true;
            } else {
              // Overnight window (e.g. 19:00 to 03:00)
              if (currentMinutes < fromMins && currentMinutes > toMins) return true;
            }
          }
        }
      }
      return false;
    }

    function renderMenuItemsWithSubcategories(items) {
      if (!items || items.length === 0) return '';

        hierarchy[cat][sub].push(item);

      let html = '';

        html += `

    // =========================================================================
    //  Helpers
    // =========================================================================
    
    // =========================================================================
    //  Order Status Formatting & Sanitization (100% immune to raw JSON)
    // =========================================================================
    function sanitizeStatus(raw) {
      if (!raw) return 'pending';
      const s = String(raw).trim();
      if (s.startsWith('[') || s.startsWith('{') || s.includes('"productId"') || s.includes('"name"')) {
        return 'pending';
      }
      return s.toLowerCase();
    }

    function formatOrderStatusDisplay(rawStatus) {
      if (!rawStatus) return 'ORDER RECEIVED ⏱️';
      const s = String(rawStatus).trim();
      if (s.startsWith('[') || s.startsWith('{') || s.includes('"productId"') || s.includes('"name"')) {
        return 'ORDER RECEIVED ⏱️';
      }
      switch (s.toUpperCase()) {
        case 'PENDING':
        case 'ORDER_RECEIVED':
        case 'TAKEN':
        case 'NEW':
          return 'ORDER RECEIVED ⏱️';
        case 'PREPARING':
        case 'ACCEPTED':
        case 'COOKING':
        case 'IN_PROGRESS':
          return 'PREPARING 🍳';
        case 'READY':
        case 'DONE':
        case 'FOOD_READY':
        case 'KITCHEN_DONE':
          return 'FOOD READY 🔔';
        case 'SERVED':
        case 'PLACED':
        case 'ON_TABLE':
        case 'DELIVERED':
          return 'SERVED 🍽️';
        case 'PAYMENT_PENDING':
        case 'BILLED':
        case 'BILL_READY':
          return 'BILL READY 🧾';
        case 'PAID':
        case 'SUCCESS':
        case 'SETTLED':
          return 'PAID & SETTLED ✅';
        case 'CANCELLED':
        case 'REJECTED':
          return 'CANCELLED ❌';
        default:
          return s.toUpperCase();
      }
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function getFilteredItems() {
      return state.menuItems.filter(item => {
        if (state.vegOnly && !item.isVeg) return false;
        if (state.activeCategory !== 'All' && item.category !== state.activeCategory) return false;
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          if (!item.name.toLowerCase().includes(q) && !(item.description || '').toLowerCase().includes(q)) return false;
        }
        return true;
      });
    }

    function getTotalCartCount() {
      return Object.values(state.cart).reduce((s, q) => s + q, 0);
    }

    function getCartSubtotal() {
      return Object.entries(state.cart).reduce((total, [id, qty]) => {
        const item = state.menuItems.find(i => i.id === id);
        return total + (item ? item.price * qty : 0);
      }, 0);
    }

    function getCartServiceCharge() {
      const sub = getCartSubtotal();
      return sub * ((Number(state.serviceCharge) || 0) / 100);
    }

    function getCartGst() {
      const sub = getCartSubtotal();
      const sc = getCartServiceCharge();
      return (sub + sc) * ((Number(state.gstRate) || 0) / 100);
    }

    function getCartGrandTotal() {
      return getCartSubtotal() + getCartServiceCharge() + getCartGst();
    }

    function getCartTotal() {
      return getCartGrandTotal();
    }

    function getNextDailyToken() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const todayKey = `${dd}${mm}`;
      
      let lastDate = '';
      let lastSeq = 0;
      try {
        lastDate = localStorage.getItem('sb_last_token_date') || '';
        if (lastDate !== todayKey) {
          lastSeq = 0;
          localStorage.setItem('sb_last_token_date', todayKey);
        } else {
          lastSeq = parseInt(localStorage.getItem('sb_last_token_seq') || '0', 10);
        }
        lastSeq += 1;
        localStorage.setItem('sb_last_token_seq', String(lastSeq));
      } catch (e) {
        lastSeq = Math.floor(1 + Math.random() * 99);

    function getCartItems() {
      return Object.entries(state.cart)
        .filter(([, qty]) => qty > 0)
        .map(([id, qty]) => ({ item: state.menuItems.find(i => i.id === id), qty }))
        .filter(ci => ci.item);
    }

    function getGrandTotal() {
      if (state.orderHistory && state.orderHistory.length > 0) {
        return state.orderHistory.reduce((sum, ord) => sum + (Number(ord.total) || 0), 0);
      }
      return state.orderPlaced ? (Number(state.orderPlaced.total) || 0) : 0;
    }

    function calculateMyItemsTotal() {
      if (!state.orderHistory || state.orderHistory.length === 0) return 0;
      let total = 0;
      state.orderHistory.forEach(round => {
        (round.items || []).forEach(it => {
          if (it.deviceId === state.deviceId || (round.deviceId === state.deviceId && !it.deviceId)) {
            total += (Number(it.price) * Number(it.qty)) || 0;
          }
        });
      });
      return total;
    }

    function getTotalItemsCountAcrossRounds() {
      if (state.orderHistory && state.orderHistory.length > 0) {
        return state.orderHistory.reduce((sum, ord) => sum + (ord.items ? ord.items.reduce((s, it) => s + (it.qty || 1), 0) : 0), 0);
      }
      return state.orderPlaced && state.orderPlaced.items ? state.orderPlaced.items.reduce((s, it) => s + (it.qty || 1), 0) : 0;
    }

    function getAllItemsAcrossRounds() {
      const itemsMap = {};
      const history = (state.orderHistory && state.orderHistory.length > 0)
        ? state.orderHistory
        : (state.orderPlaced ? [state.orderPlaced] : []);

      history.forEach(round => {
        (round.items || []).forEach(it => {
          const guest = it.orderedBy || round.customerName || 'Guest';
          const dishName = it.name || 'Dish';
          const price = Number(it.price) || 0;
          const key = dishName + '___' + price + '___' + guest;
          if (itemsMap[key]) {
            itemsMap[key].qty += (Number(it.qty) || 1);
          } else {
            itemsMap[key] = {
              name: dishName,
              qty: Number(it.qty) || 1,
              price: price,
              orderedBy: guest
            };
          }
        });
      });
      return Object.values(itemsMap);
    }

    function buildFallbackReceipt(orderHistory, grandTotal) {
      return {
        billId: 'BILL_T' + state.tableNumber + '_' + (state.orderPlaced?.kotNumber || Date.now().toString().slice(-4)),
        timestamp: new Date().toLocaleString(),
        customerName: state.customerName || 'Guest',
        customerPhone: state.customerPhone || '',
        paymentMode: 'UPI',
        transactionId: state.transactionId || 'PAID',
        items: getAllItemsAcrossRounds(),
        totalAmount: grandTotal,
        tableNumber: state.tableNumber,
        savedAt: Date.now()
      };
    }

    function getUpiAppUri(appId, grandTotal) {
      const pa = state.upiId || '';
      const pn = state.restaurant?.name || 'Restaurant';
      const am = grandTotal.toFixed(2);
      const cu = 'INR';
      const tn = `Table ${state.tableNumber} Bill`;

      const standardQuery = `pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn)}&am=${am}&cu=${cu}&tn=${encodeURIComponent(tn)}`;

      switch (appId) {
        case 'PHONEPE':
          return `phonepe://pay?${standardQuery}`;
        case 'GPAY':
          return `tez://upi/pay?${standardQuery}`;
        case 'PAYTM':
          return `paytmmp://pay?${standardQuery}`;
        case 'CRED':
          return `credpay://upi/pay?${standardQuery}`;
        case 'BHIM':
        case 'ANY':
        default:
          return `upi://pay?${standardQuery}`;
      }
    }

        showToast('No balance due to pay.', 'info');

      const razorpayKey = state.razorpayKeyId || 'rzp_test_51placeholder';
      const primaryKot = state.orderPlaced?.kotNumber || ('KOT-' + Math.floor(1000 + Math.random() * 9000));

      const options = {
        key: razorpayKey,
        amount: Math.round(amountToPay * 100), // in paise
        currency: "INR",
        name: state.restaurant?.name || "SmartDine Restaurant",
        description: `Table ${state.tableNumber} Dining Bill (${primaryKot})`,
        image: "/assets/logo.png",
        prefill: {
          name: state.customerName || `Table ${state.tableNumber} Guest`,
          contact: state.customerPhone || ""
        },
        notes: {
          table: String(state.tableNumber),
          orgId: state.organizationId || "",
          kot: primaryKot,
          settlementUpiId: state.settlementUpiId || state.upiId || "",
          platform: "SmartDine Web QR"

        theme: {
          color: "#F59E0B"

        handler: async function (response) {
          console.log("[Razorpay] Payment Success Handler:", response);
          await handleSuccessfulPayment(
            response.razorpay_payment_id,
            response.razorpay_order_id || ('RZP_ORD_' + Date.now()),
            response.razorpay_signature || 'verified_checkout',
            amountToPay
          );
        },
        modal: {
          ondismiss: function () {
            console.log("[Razorpay] Checkout modal dismissed by user");
            showToast('Payment window closed.', 'info');
          }
        }
      };

      try {
        if (typeof Razorpay === 'undefined') {
          showToast('Loading Razorpay secure gateway...', 'info');
          const script = document.createElement('script');
          script.src = 'https://checkout.razorpay.com/v1/checkout.js';
          script.onload = () => {
            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function (resp) {
              console.error("[Razorpay] Payment Failed:", resp.error);
              showToast(`Payment failed: ${resp.error.description || 'Transaction declined'}`, 'error');
            });
            rzp.open();
          };
          script.onerror = () => showToast('Failed to load Razorpay. Please pay at counter.', 'error');
          document.head.appendChild(script);
          return;

        const rzp = new Razorpay(options);

          console.error("[Razorpay] Payment Failed:", resp.error);
          showToast(`Payment failed: ${resp.error.description || 'Transaction declined'}`, 'error');

    // =========================================================================
    // =========================================================================
    //  Cryptographic Standards (AES-CBC + HMAC-SHA256)
    // =========================================================================
    const CLIENT_SECRET_SALT = "SmartDinePosZeroCostPlatform2026S";

    async function deriveWebCryptoKey(orgId, purpose) {
      const enc = new TextEncoder();
      const rawKeyText = `${orgId || 'DEFAULT'}_${purpose}_${CLIENT_SECRET_SALT}`;
      return await crypto.subtle.digest('SHA-256', enc.encode(rawKeyText));
    }

    async function encryptPayloadForWebhook(orgId, dataObj) {
      try {
        if (!window.crypto || !window.crypto.subtle) {
          return { encrypted: false, org_id: orgId, data: dataObj };
        }
        const enc = new TextEncoder();
        const plainBytes = enc.encode(JSON.stringify(dataObj));
        const iv = window.crypto.getRandomValues(new Uint8Array(16));
        const rawAesKey = await deriveWebCryptoKey(orgId, 'aes');

        const cryptoKey = await crypto.subtle.importKey(
          'raw',
          rawAesKey,
          { name: 'AES-CBC' },
          false,
          ['encrypt']
        );

        const cipherBuffer = await crypto.subtle.encrypt(
          { name: 'AES-CBC', iv: iv },
          cryptoKey,
          plainBytes
        );

        const ivBase64 = btoa(String.fromCharCode(...iv));
        const ctBase64 = btoa(String.fromCharCode(...new Uint8Array(cipherBuffer)));
        const ts = Date.now();

        // Compute HMAC-SHA256 signature
        const message = `${orgId}_${ts}_${ivBase64}_${ctBase64}`;
        const rawHmacKey = await deriveWebCryptoKey(orgId, 'hmac');
        const hmacKey = await crypto.subtle.importKey(
          'raw',
          rawHmacKey,
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const sigBuffer = await crypto.subtle.sign('HMAC', hmacKey, enc.encode(message));
        const sigHex = Array.from(new Uint8Array(sigBuffer))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');

        return {
          encrypted: true,
          v: 1,
          org_id: orgId,
          ts: ts,
          iv: ivBase64,
          ct: ctBase64,
          sig: sigHex
        };
      } catch (err) {
        console.warn('Crypto encryption fallback:', err);
        return {
          encrypted: false,
          org_id: orgId,
          data: dataObj
        };
      }
    }

    async function decryptPayloadFromWebhook(orgId, envelope) {
      try {
        if (!envelope || !envelope.encrypted) {
          return envelope && envelope.data ? envelope.data : envelope;
        }
        if (!window.crypto || !window.crypto.subtle) return null;

        const ts = envelope.ts;
        const ivBase64 = envelope.iv;
        const ctBase64 = envelope.ct;
        const sig = envelope.sig;
        if (!ts || !ivBase64 || !ctBase64 || !sig) return null;

        // Anti-replay attack check (5-minute sliding window)
        if (Math.abs(Date.now() - ts) > 300000) {
          console.warn('Webhook payload timestamp expired. Potential replay attack.');
          return null;
        }

        // Verify HMAC-SHA256 signature
        const enc = new TextEncoder();
        const message = `${orgId}_${ts}_${ivBase64}_${ctBase64}`;
        const rawHmacKey = await deriveWebCryptoKey(orgId, 'hmac');
        const hmacKey = await crypto.subtle.importKey(
          'raw',
          rawHmacKey,
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const sigBuffer = await crypto.subtle.sign('HMAC', hmacKey, enc.encode(message));
        const expectedSig = Array.from(new Uint8Array(sigBuffer))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');

        if (sig.toLowerCase() !== expectedSig.toLowerCase()) {
          console.warn('Cryptographic signature mismatch. Data tampering detected.');
          return null;
        }

        // Decrypt AES-256-CBC
        const rawAesKey = await deriveWebCryptoKey(orgId, 'aes');
        const cryptoKey = await crypto.subtle.importKey(
          'raw',
          rawAesKey,
          { name: 'AES-CBC' },
          false,
          ['decrypt']
        );

        const ivBytes = Uint8Array.from(atob(ivBase64), c => c.charCodeAt(0));
        const ctBytes = Uint8Array.from(atob(ctBase64), c => c.charCodeAt(0));

        const plainBuffer = await crypto.subtle.decrypt(
          { name: 'AES-CBC', iv: ivBytes },
          cryptoKey,
          ctBytes
        );

        const dec = new TextDecoder();
        return JSON.parse(dec.decode(plainBuffer));
      } catch (err) {
        console.warn('Crypto decryption error:', err);
        return null;
      }
    }

    // =========================================================================
    //  Google Apps Script & Google Sheet API Integrations (Zero Cost)
    // =========================================================================
    async function sendToGoogleSheetWebhook(action, payloadData) {
      if (!state.googleSheetId && !state.organizationId) return false;
      const orgId = state.organizationId || 'DEFAULT_ORG';
      const clientRequestId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'req_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

      const body = {
        action: action,
        org_id: orgId,
        spreadsheet_id: state.googleSheetId,
        client_request_id: clientRequestId,
        data: Object.assign({ client_request_id: clientRequestId }, payloadData || {})
      };

      try {
        const resp = await fetch(DEFAULT_APPS_SCRIPT_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        if (resp.ok) {
          try {
            const resJson = await resp.json();
            return resJson;
          } catch (_) {
            return { success: true, ok: true };
          }
        }
        return false;
      } catch (e) {
        console.warn('Webhook post warning:', e);
        return false;
      }
    }

    async function confirmAndRecordPayment() {
      if (state.submittingPayment) return;
      const input = document.getElementById('utrInput');
      let utr = (input ? input.value : '').trim();

      // Fallback: If guest did not enter UTR, generate a readable reference
      if (!utr || utr.length < 4) {

      state.submittingPayment = true;
      renderOrderSuccess();

      try {
        const grandTotal = getGrandTotal();
        const allItems = getAllItemsAcrossRounds();
        const selectedAppObj = UPI_APPS.find(a => a.id === state.selectedUpiApp) || UPI_APPS[0];
        const primaryKot = state.orderPlaced?.kotNumber || ('KOT-' + Math.floor(1000 + Math.random() * 9000));
        const billDocId = 'BILL_' + primaryKot;

        // 1. Send Payment Record to Google Sheet
        const billPayload = {
          id: billDocId,
          bill_id: billDocId,
          table_name: 'Table ' + state.tableNumber,
          customer_name: state.customerName.trim() || ('Table ' + state.tableNumber),
          customer_phone: state.customerPhone.trim() || '',
          items: allItems.map(it => ({
            name: it.name,
            qty: it.qty,
            price: it.price,

            orderedBy: it.orderedBy || state.customerName
          })),
          total_amount: grandTotal,

          upi_reference: utr,
          timestamp: new Date().toISOString(),
          paid_at: new Date().toISOString(),
          paid_by: state.customerName.trim()
        };

        // 1. Zero Cloud Cost: Signal payment submission to Google Sheet
        console.log('[Payment] Submitting payment verification to Google Sheet for Table', state.tableNumber, utr);

        // 2. Signal payment to Google Sheet webhook
        if (state.googleSheetId || state.organizationId) {
          await sendToGoogleSheetWebhook('SAVE_BILL', billPayload);
        }

        // 3. Anti-Fraud Two-Phase Verification:
        // Set state to payment_submitted (NOT paid!).
        // The green receipt is ONLY unlocked when cashier/backend confirms 'PAID'.
        state.transactionId = utr;
        state.paymentSubmitted = true;
        state.orderStatus = 'payment_submitted';
        state.paymentConfirmModalOpen = false;
        state.submittingPayment = false;

        showToast('Payment submitted! Verifying with cashier... ⏳', 'info');
        renderOrderSuccess();

        // Trigger immediate background sync check
        syncOrdersFromGoogleSheet();

      } catch (err) {
        state.submittingPayment = false;
        console.error('Payment settlement failed:', err);
        showToast('Failed to record payment. Please try again or alert staff.', 'error');
        renderOrderSuccess();
      }
    }

    function autoDownloadReceipt(receipt) {
      try {
        const htmlContent = generateReceiptHtml(receipt);
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Receipt_Table_${receipt.tableNumber}_${Date.now()}.html`;
        document.body.appendChild(a);
        a.click();

    function updateCartUI(itemId) {
      // 1. Tactile mobile haptic feedback
      try {
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(25);
        }
      } catch (_) {}

      // 2. Targeted update for specific item action container
      const actionContainer = document.getElementById(`action-btn-${itemId}`);
      if (actionContainer) {
        const item = state.menuItems.find(m => m.id === itemId);
        if (item) {
          const isAvailable = item.available !== false && item.is_available !== false && item.isAvailable !== false;
          const isTimeAvail = isItemTimeAvailable(item);
          const qty = (isAvailable && isTimeAvail) ? (state.cart[item.id] || 0) : 0;
          actionContainer.innerHTML = renderCardActionButton(item, qty, isAvailable, isTimeAvail);
          try { lucide.createIcons(); } catch (_) {}
        }
      }

      // 3. Update floating cart bar with bounce animation
      const cartCount = getTotalCartCount();
      const cartTotal = getCartTotal();
      const floatBar = document.getElementById('floatingCartContainer');
      const badgeCount = document.getElementById('cartBadgeCount');
      const totalAmount = document.getElementById('cartTotalAmount');

      if (floatBar) {
        if (cartCount > 0) {
          floatBar.classList.remove('hidden');
          floatBar.classList.add('fade-in');
        } else {
          floatBar.classList.add('hidden');
        }
      }

      if (badgeCount) {
        badgeCount.textContent = cartCount;
        badgeCount.classList.remove('bounce-active');
        void badgeCount.offsetWidth;
        badgeCount.classList.add('bounce-active');
      }

      if (totalAmount) {
        totalAmount.textContent = `₹${cartTotal.toFixed(0)} →`;
        totalAmount.classList.remove('bounce-active');
        void totalAmount.offsetWidth;
        totalAmount.classList.add('bounce-active');
      }

      // 4. If checkout drawer is open, keep its list in sync without losing user inputs
      if (state.checkoutOpen) {
        saveFormFields();
        renderMenu();
      }
    }

    function addToCart(itemId) {
      const item = state.menuItems.find(m => m.id === itemId);
      if (!item) return;
      if (item.available === false || item.is_available === false || item.isAvailable === false) {
        showToast(`Sorry, "${item.name}" is currently sold out.`, 'error');
        return;
      }
      if (!isItemTimeAvailable(item)) {
        const tr = (item.availableFrom && item.availableTo) ? `${item.availableFrom} - ${item.availableTo}` : 'specific hours';
        showToast(`"${item.name}" is only available between ${tr}.`, 'info');
        return;
      }
      if (isKitchenClosedNow()) {
        showToast('Kitchen is currently closed between shifts.', 'error');
        return;
      }
      const curQty = state.cart[itemId] || 0;
      if (curQty >= 20) {
        showToast(`Maximum 20 plates per item allowed`, 'info');
        return;
      }
      state.cart[itemId] = curQty + 1;
      updateCartUI(itemId);
    }

    function removeFromCart(itemId) {
      if (state.cart[itemId]) {
        state.cart[itemId]--;
        if (state.cart[itemId] <= 0) delete state.cart[itemId];
      }
      updateCartUI(itemId);
    }

    // =========================================================================
    //  Real-Time Input Validation & Anti-Formula Injection Helpers
    // =========================================================================
    function sanitizeFormulaPrefix(str) {
      if (!str) return '';
      const s = String(str).trim();
      // If starts with =, +, -, @ (formula injection triggers in Sheets), prepend single quote
      if (/^[=+\-@]/.test(s)) {
        return "'" + s;
      }
      return s;
    }

    function validateNameLive(input) {
      const val = (input.value || '').trim();
      const badge = document.getElementById('nameValidBadge');
      const err = document.getElementById('nameErrorMsg');
      state.customerName = val;
      try { localStorage.setItem('sb_customer_name', val); } catch (e) {}

      if (val.length >= 2) {
        if (badge) badge.classList.remove('hidden');
        if (err) err.classList.add('hidden');
        input.classList.remove('ring-2', 'ring-red-500', 'border-red-400');
        input.classList.add('border-emerald-300', 'ring-1', 'ring-emerald-400');
        return true;
      } else {
        if (badge) badge.classList.add('hidden');
        if (val.length > 0) {
          if (err) {
            err.textContent = 'Name must be at least 2 characters';
            err.classList.remove('hidden');
          }
        } else {
          if (err) err.classList.add('hidden');
        }
        input.classList.remove('border-emerald-300', 'ring-1', 'ring-emerald-400');
        return false;
      }
    }

    function validatePhoneLive(input) {
      let digits = (input.value || '').replace(/\D/g, '').slice(0, 10);
      input.value = digits;
      const badge = document.getElementById('phoneValidBadge');
      const err = document.getElementById('phoneErrorMsg');
      state.customerPhone = digits;
      try { localStorage.setItem('sb_customer_phone', digits); } catch (e) {}

      if (digits.length === 0) {
        if (badge) badge.classList.add('hidden');
        if (err) err.classList.add('hidden');
        input.classList.remove('ring-2', 'ring-red-500', 'border-emerald-300', 'ring-1', 'ring-emerald-400');
        return true;
      }

      if (/^[6-9]\d{9}$/.test(digits)) {
        if (badge) badge.classList.remove('hidden');
        if (err) err.classList.add('hidden');
        input.classList.remove('ring-2', 'ring-red-500', 'border-red-400');
        input.classList.add('border-emerald-300', 'ring-1', 'ring-emerald-400');
        return true;
      } else {
        if (badge) badge.classList.add('hidden');
        if (err) {
          if (digits.length < 10) {
            err.textContent = `Enter complete 10-digit mobile (${digits.length}/10)`;
          } else {
            err.textContent = 'Must start with 6, 7, 8, or 9';
          }
          err.classList.remove('hidden');
        }
        input.classList.remove('border-emerald-300', 'ring-1', 'ring-emerald-400');
        input.classList.add('ring-2', 'ring-red-500', 'border-red-400');
        return false;
      }
    }
