name: smart_restaurant_pos
description: SmartBizz - One billing app for restaurants, kirana, supermarkets, pharmacies and retail.
version: 1.2.0+55

environment:
  sdk: ">=3.0.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  open_file: ^3.3.2
  path_provider: ^2.1.2

  flutter_riverpod: ^3.3.1
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.1
  state_notifier: ^1.0.0
  dio: ^5.7.0
  http: ^1.2.0
  google_fonts: ^8.1.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.1
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.0
  pdf: ^3.10.8
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  print_bluetooth_thermal: ^1.2.2
  esc_pos_utils_plus: ^2.0.3
  permission_handler: ^11.3.1

  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_database: ^12.4.1
  cloud_firestore: any
  firebase_storage: any
  firebase_messaging: any
  device_info_plus: any
  bcrypt: ^1.1.3
  encrypt: ^5.0.3
  crypto: ^3.0.3
  share_plus: any
  flutter_screenutil: ^5.9.0
  animations: ^2.0.7
  mailer: ^6.1.4
  web: ^1.1.0
  flutter_tts: ^4.2.5
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png
    - lib/assets/app_icons/

# Re-generate the SmartBizz brand icons with `dart run flutter_launcher_icons`.
# The per-trade launcher icons (Android aliases, iOS AppIcon-<trade>) come from
# assets_src/app_icons/generate_icons.py and are not touched by this tool.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets_src/app_icons/brand_full.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F2557"
  adaptive_icon_foreground: "assets_src/app_icons/brand_fg.png"
  web:
    generate: true
    image_path: "assets_src/app_icons/brand_round.png"
    background_color: "#0F2557"
    theme_color: "#0F2557"
  windows:
    generate: true
    image_path: "assets_src/app_icons/brand_round.png"
    icon_size: 48
